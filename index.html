<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stop Watch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="hero">
        <div class="container">
            <div class="clock">
                <span id="hours">00</span>
                <span>:</span>
                <span id="minutes">00</span>
                <span>:</span>
                <span id="seconds">00</span>
            </div>
            <div class="buttons">
                <button class="timeChanger" onclick="counterStart()" id="start">Start</button>
                <button class="timeChanger" onclick="counterStop()" id="stop">Stop</button>
                <button class="timeChanger" onclick="counterReset()">Reset</button>
               </div>
        </div>
    </div>
    
    <div class="footer">
        <p>copyright © <span id="yearChanger"></span> Zeeshan Haider Soomro.All rights reserved.</p>
    </div>

    <script src="app.js"></script>
</body>
</html>
